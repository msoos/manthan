name: build

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -yq help2man libgmp-dev libmpfr-dev libboost-all-dev cmake build-essential libboost-program-options-dev libreadline-dev libgmp-dev python3-venv

    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install Python dependencies
      run: |
        python3 -m venv manthan-venv
        source manthan-venv/bin/activate
        python3 -m pip install -r requirements.txt
        ./configure_dependencies.sh --all
        ./manthan.py ../benchmarks/factorization8.qdimacs
